name: Run Unit Tests

on:
    push:
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - run: pnpm install
            - run: pnpm run lint
            - run: pnpm run test
            - run: pnpm run build
